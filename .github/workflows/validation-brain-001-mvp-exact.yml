name: Validation BRAIN-001 MVP Exact

on:
  push:
    branches: [validation/brain-001-mvp-e665efbe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: e665efbe295c7c68de1862aee85484f5c8a23884
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact HEAD
        run: |
          test "$(git rev-parse HEAD)" = "e665efbe295c7c68de1862aee85484f5c8a23884"
          git rev-parse HEAD
      - name: Syntax checks
        run: |
          node --check intento_2/webapp/js/combat.js
          node --check intento_2/webapp/js/game/state.js
          node --check intento_2/webapp/js/storage/save_manager.js
          node --check intento_2/webapp/js/combat_presentation.js
          node --check tests/combat_presentation_attack_impact.test.mjs
          node --check tests/save_manager.test.mjs
          node --check tests/phase19_presentation.test.mjs
      - name: Full repository tests
        run: node --test tests/*.test.mjs
