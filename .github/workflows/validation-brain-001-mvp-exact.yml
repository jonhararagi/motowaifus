name: Validation BRAIN-001 MVP Exact

on:
  push:
    branches: [validation/brain-001-mvp-a0fdc4ce]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: a0fdc4ce3d584b1a2451bbb6e834d2542d90ef0f
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact HEAD
        run: |
          test "$(git rev-parse HEAD)" = "a0fdc4ce3d584b1a2451bbb6e834d2542d90ef0f"
          git rev-parse HEAD
      - name: Syntax checks
        run: |
          node --check intento_2/webapp/js/combat.js
          node --check intento_2/webapp/js/game/state.js
          node --check intento_2/webapp/js/storage/save_manager.js
          node --check tests/combat_presentation_attack_impact.test.mjs
          node --check tests/save_manager.test.mjs
      - name: Full repository tests
        run: node --test tests/*.test.mjs
